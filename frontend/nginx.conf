worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    map $http_x_forwarded_proto $forwarded_proto {
        default $scheme;
        https https;
    }

    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;
        # Keep redirects relative so Funnel's public host/port is preserved.
        absolute_redirect off;
        add_header X-Content-Type-Options nosniff always;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location = /api {
            return 308 /api/;
        }

        location /api/ {
            proxy_pass http://backend:8000/;
            # A terrain route plans one A* search per leg (~1 s each at 60 m cells), so a
            # long round trip can legitimately outlast nginx's 60 s default read timeout.
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /assets/ {
            expires 1y;
            try_files $uri =404;
        }

        location = /index.html {
            add_header Cache-Control "no-cache";
            add_header X-Content-Type-Options nosniff always;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
