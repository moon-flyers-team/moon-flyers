name: Build and deploy to Beelink

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  frontend-tests:
    name: Frontend contracts, build, and isolated mock HTTP
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend test
      - run: pnpm --dir frontend build
      - run: pnpm --dir frontend test:mock:isolated

  backend-tests:
    name: Backend unit and API tests (offline fixtures)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -m pytest -q
        working-directory: backend

  build:
    name: Build and smoke-test containers
    needs: [frontend-tests, backend-tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      target: ${{ steps.release.outputs.target }}
    env:
      REVISION: ${{ github.sha }}
      HTTP_PORT: "18080"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select deployment and validate release ancestry
        id: release
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # Only release commits already incorporated into main.
            git fetch origin main
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main
            echo 'target=production' >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/heads/main ]]; then
            echo 'target=test' >> "$GITHUB_OUTPUT"
          else
            echo 'Unsupported deployment ref' >&2
            exit 1
          fi

      - name: Test deployment promotion, rollback, and gateway routing
        run: python3 -m unittest discover -s deploy -p 'test_*.py' -v

      - name: Validate standalone gateway configuration
        run: docker compose -f deploy/gateway/compose.yaml config --quiet

      - name: Validate optional terrain overlay configuration
        env:
          LOLA_DATA_DIR: /srv/lola-dataset
        run: docker compose -f deploy/compose.yaml -f deploy/compose.terrain.yaml config --quiet

      - name: Build backend
        run: docker build --tag "moon-flyers-backend:$REVISION" backend

      - name: Build frontend
        run: docker build --tag "moon-flyers-frontend:$REVISION" frontend

      - name: Start isolated smoke-test stack
        run: docker compose -p moon-flyers-ci -f deploy/compose.yaml up -d --no-build --pull never --wait --wait-timeout 120

      - name: Check frontend, API, and API documentation
        run: python3 deploy/smoke-test.py http://127.0.0.1:18080

      - name: Verify API abuse limits on the isolated stack
        run: python3 deploy/check-api-limit.py http://127.0.0.1:18080

      # The fixture is synthetic, tiny and test-only: it proves the read-only mount,
      # startup validation and proxy work in the real image without real LOLA data.
      - name: Verify optional read-only terrain mount
        shell: bash
        env:
          TERRAIN_PORT: "18083"
        run: |
          set -euo pipefail
          mkdir -p ci-terrain
          python3 backend/tools/lola_fixture.py ci-terrain/lola_dem
          export LOLA_DATA_DIR="$PWD/ci-terrain/lola_dem" HTTP_PORT="$TERRAIN_PORT"
          terrain() {
            docker compose --project-name moon-flyers-ci-terrain \
              -f deploy/compose.yaml -f deploy/compose.terrain.yaml "$@"
          }
          terrain up -d --no-build --pull never --wait --wait-timeout 120
          python3 deploy/smoke-test.py "http://127.0.0.1:$TERRAIN_PORT"
          terrain logs --no-color backend | grep -F 'LOLA DEM dataset validated at /data/lola'

      - name: Container logs on failure
        if: failure()
        env:
          LOLA_DATA_DIR: ${{ github.workspace }}/ci-terrain/lola_dem
          HTTP_PORT: "18083"
        run: |
          docker compose -p moon-flyers-ci -f deploy/compose.yaml logs --no-color --tail 100 || true
          docker compose -p moon-flyers-ci-terrain -f deploy/compose.yaml -f deploy/compose.terrain.yaml \
            logs --no-color --tail 100 || true

      - name: Stop smoke-test stacks
        if: always()
        env:
          LOLA_DATA_DIR: ${{ github.workspace }}/ci-terrain/lola_dem
          HTTP_PORT: "18083"
        run: |
          docker compose -p moon-flyers-ci -f deploy/compose.yaml down
          docker compose -p moon-flyers-ci-terrain -f deploy/compose.yaml -f deploy/compose.terrain.yaml down || true

      - name: Package immutable release
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bundle artifact
          docker save "moon-flyers-backend:$REVISION" "moon-flyers-frontend:$REVISION" --output bundle/images.tar
          cp deploy/compose.yaml deploy/compose.terrain.yaml deploy/deploy.sh deploy/smoke-test.py bundle/
          printf '%s\n' "$REVISION" > bundle/REVISION
          tar -czf artifact/release.tar.gz -C bundle .

      - name: Store release bundle
        if: github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ github.sha }}
          path: artifact/release.tar.gz
          retention-days: 7
          if-no-files-found: error
          overwrite: true

  deploy:
    name: Deploy ${{ needs.build.outputs.target }}
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: beelink-${{ needs.build.outputs.target }}
      cancel-in-progress: false
    environment:
      name: ${{ needs.build.outputs.target }}
      url: ${{ steps.deploy.outputs.url }}
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    env:
      DEPLOY_HOST: ${{ vars.BEELINK_HOST || 'beelink.tail644248.ts.net' }}
      PUBLIC_HOST: ${{ vars.PUBLIC_HOST || vars.BEELINK_HOST || 'beelink.tail644248.ts.net' }}
      DEPLOY_USER: ${{ vars.BEELINK_USER || 'maxence' }}
      DEPLOY_ENV: ${{ needs.build.outputs.target }}
    steps:
      # No repository checkout or PR code execution in the privileged job.
      - name: Check workload identity configuration
        env:
          TS_CLIENT_ID: ${{ vars.TS_CLIENT_ID }}
          TS_AUDIENCE: ${{ vars.TS_AUDIENCE }}
        run: |
          if [[ -z "$TS_CLIENT_ID" || -z "$TS_AUDIENCE" ]]; then
            echo 'Set TS_CLIENT_ID and TS_AUDIENCE in this GitHub environment.' >&2
            exit 1
          fi

      - name: Reject superseded test builds
        if: needs.build.outputs.target == 'test'
        shell: bash
        run: |
          set -euo pipefail
          latest=$(git ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" refs/heads/main | cut -f1)
          if [[ "$latest" != "$GITHUB_SHA" ]]; then
            echo 'A newer main commit exists; deploy its workflow run instead.' >&2
            exit 1
          fi

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-${{ github.sha }}
          path: artifact

      - name: Connect privately to Tailscale
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4
        with:
          oauth-client-id: ${{ vars.TS_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:moon-flyers-ci
          version: "1.104.7"
          ping: ${{ env.DEPLOY_HOST }}

      - name: Transfer and activate release over Tailscale SSH
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$PUBLIC_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          case "$DEPLOY_ENV" in
            production) suffix='' ;;
            test) suffix=':8443' ;;
            *) exit 2 ;;
          esac
          # Each attempt has its own directory, leaving the current release intact
          # until containers and HTTP checks pass. No shell-interpolated secrets.
          release="moon-flyers/$DEPLOY_ENV/releases/$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          tailscale ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "umask 077; mkdir -p '$release' && tar -xzf - -C '$release' && bash '$release/deploy.sh' '$DEPLOY_ENV'" \
            < artifact/release.tar.gz
          url="https://$PUBLIC_HOST$suffix"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          printf '### %s deployed\n\nCommit: `%s`\n\n%s\n' "$DEPLOY_ENV" "$GITHUB_SHA" "$url" >> "$GITHUB_STEP_SUMMARY"

  verify-public:
    name: Verify public Funnel URL
    needs: [build, deploy]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PUBLIC_URL: ${{ needs.deploy.outputs.url }}
    steps:
      # A fresh runner without Tailscale verifies actual internet access.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-${{ github.sha }}
          path: artifact
      - name: Check public frontend and API
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf artifact/release.tar.gz -C artifact ./smoke-test.py
          python3 artifact/smoke-test.py "$PUBLIC_URL" --attempts 12
