# Optional, release-snapshotted LOLA DEM overlay. No public ports, no writer.
# The backend reads LOLA_DEM_DIR (src/lunar_horizon_dem.py) from this read-only mount.
services:
  backend:
    environment:
      LOLA_DEM_DIR: /data/lola
    volumes:
      - type: bind
        source: ${LOLA_DATA_DIR:?Set LOLA_DATA_DIR to a verified dataset dem directory}
        target: /data/lola
        read_only: true
        bind:
          create_host_path: false
